- title: "Screw-Motion Planner for a 7-DOF Kinova Gen3"
  section: research
  label: "Graduate research · Jan 2026 – present"
  description: "A C++ planner whose RRT edges are dual-quaternion screw motions (ScLERP), tracked in joint space by resolved-motion rate control. All the algebra, kinematics, and search are written from scratch, with every path independently re-validated in MuJoCo across a 5,000-trial benchmark."
  video: "/assets/planner_wall_hole_example.mp4"
  metrics:
    - value: "99.1%"
      label: "free-space goals reached"
    - value: "108 ms"
      label: "median planning time"
    - value: "0"
      label: "collisions in 4,736 reached paths"
  tags: ["C++17", "Eigen", "MuJoCo", "Dual Quaternions", "ScLERP", "RMRC", "RRT / RRT*"]
  url: "/projects/motion-planner.html"
  github: "https://github.com/ashton-gomes/ashton-motion-planner"

