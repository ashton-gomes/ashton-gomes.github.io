- title: "What Actually Makes RRT Better? A 450-Run Study"
  section: projects
  label: "Motion planning · Benchmark study"
  description: "Nine RRT variants across five environments and ten seeds. Corridor sampling failed outright on mazes, and a data-driven combination of bidirectional trees, obstacle-aware sampling, and Voronoi-bias expansion solved all five environments 100% of the time."
  image: "/assets/rrt_study_tree.svg"
  image_fit: "contain"
  tags: ["Python", "RRT-Connect", "Sampling Strategies", "Benchmark Design"]
  url: "/projects/rrt-study.html"

