  image_position: "center center"
  image_fit: "contain"
  tags: ["SolidWorks", "FEA", "Teensy 4.1", "Modbus RTU", "Python", "Fabrication"]
  url: "/projects/shockdyno.html"

- title: "Baja SAE Vehicle Dynamics"
  section: projects
  label: "Stony Brook Motorsports · Team lead"
  description: "I lead a 12-member steering, suspension, and brakes group. I built MATLAB and Python suspension models that carry the CAD hardpoints through to motion ratio, spring rates, and quarter-car damper targets, reduced the inside turning radius from 9 ft to 2 ft, and redesigned the control arms to be 0.8 lb lighter with 40% less predicted deformation. The team placed 9th overall in dynamic events."
  image: "/assets/bajasae_finalimage.jpg"
  image_position: "center center"
