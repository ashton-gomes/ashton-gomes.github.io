  tags: ["MATLAB", "Python", "SolidWorks", "Suspension Kinematics", "Quarter-Car Modeling", "FEA", "Jig Design", "Leadership"]
  url: "/projects/baja-sae.html"

- title: "Crazyflie Autonomous Arena Mission"
  section: projects
  label: "Autonomy · Ongoing project"
  description: "A small quadrotor that crosses an unknown obstacle field, finds a raised pad using only a downward range sensor, maps its edges, and lands on it using only onboard sensing. In my best flight, it completed the full outbound mission and landed on the pad in 75 s."
  image: "/assets/crazyflie_mission.svg"
  image_fit: "contain"
  tags: ["Python", "cflib", "Optical Flow", "Obstacle Avoidance", "Multithreading"]
  url: "/projects/crazyflie.html"

- title: "RRT Planner Enhancement Benchmark"
  section: projects
  label: "Motion planning · Benchmark study"
  description: "I tested nine RRT variants across five environments with ten seeds each, for 450 runs in total. Corridor sampling failed every run on the maze and bug-trap, while a combination of bidirectional trees, obstacle-aware sampling, and Voronoi-bias expansion chosen from the results solved all five environments every time."
  image: "/assets/rrt_e5_combined_v2.png"
  image_fit: "contain"
  tags: ["Python", "RRT-Connect", "Sampling Strategies", "Benchmark Design"]
  url: "/projects/rrt-study.html"

- title: "Kinova Gen3 Kinematics & Trajectory Planning"
  section: projects
  label: "Robotics foundation"
  description: "Screw axes derived from the URDF, product-of-exponentials FK checked to 10⁻¹⁴, singularity analysis, Newton–Raphson IK, and five trajectory planners, all written from first principles in Python. This work became the starting point for my C++ research planner."
  video: "/assets/Circle_Animation.mp4"
  tags: ["Python", "Screw Theory", "Inverse Kinematics", "Trajectory Planning"]
  url: "/projects/robotics.html"
