- title: "Screw-Motion Planner for a 7-DOF Kinova Gen3"
  section: research
  label: "Graduate research · Jan 2026 – present"
  description: "A C++ planner where each RRT edge is a dual-quaternion screw motion (ScLERP) that is tracked in joint space with resolved-motion rate control. I wrote the algebra, kinematics, and search from scratch, and every path in the 5,000-trial benchmark is checked again separately in MuJoCo."
  video: "/assets/planner_wall_hole_example_web.mp4"
  video_poster: "/assets/planner_wall_hole_example_poster.jpg"
  metrics:
    - value: "99.1%"
      label: "free-space goals reached"
    - value: "108 ms"
      label: "median planning time"
    - value: "0"
      label: "collisions in 4,736 reached paths"
  tags: ["C++17", "Eigen", "MuJoCo", "Dual Quaternions", "ScLERP", "RMRC", "RRT / RRT*"]
  url: "/projects/motion-planner.html"
  github: "https://github.com/ashton-gomes/ashton-motion-planner"

- title: "Custom Shock Dynamometer"
  section: projects
  label: "Senior design · Mechanical & mechatronics"
  description: "A crank-driven dyno built for Stony Brook Motorsports, with a Whiffle Tree load path (FEA FoS of 3.1 for the frame and 5.8 for the Whiffle Tree), Teensy 4.1 firmware that controls a VFD over Modbus and reads a 24-bit force channel, and a Python pipeline. It produced the team's first measured damping coefficients, which showed which direction to take the shock revalving."
