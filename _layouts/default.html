<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.tagline | escape }}">
  <title>{% if page.layout == 'home' %}{{ site.title | escape }} | Mechanical Engineering{% else %}{{ page.title | escape }} | {{ site.title | escape }}{% endif %}</title>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  {% if page.layout == 'project' %}
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
  {% endif %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/#research' | relative_url }}">Research</a>
        <a href="{{ '/#projects' | relative_url }}">Projects</a>
        <a href="{{ '/#experience' | relative_url }}">Experience</a>
        <a href="{{ site.resume_url | relative_url }}">Resume</a>
        <a href="mailto:{{ site.email }}">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>{{ site.title }} <span aria-hidden="true">&middot;</span> Mechanical Engineering</p>
      <p>&copy; {{ site.time | date: '%Y' }}</p>
    </div>
  </footer>

  <script>
    // Cache the site, including videos, for offline viewing (see /sw.js).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('{{ "/sw.js" | relative_url }}');
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    }
  </script>
</body>
</html>
